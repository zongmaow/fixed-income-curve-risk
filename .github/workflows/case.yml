name: case

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LibreOffice so workbook formulas can be cached
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce from the frozen curve, then check and test
        run: |
          python reproduce_case.py
          python validate_independently.py
          python -m unittest discover -s tests -v
